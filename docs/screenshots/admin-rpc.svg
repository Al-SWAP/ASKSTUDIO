<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050508"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="800" fill="url(#bg)"/>

  <!-- Top nav -->
  <rect x="0" y="30" width="1280" height="52" fill="#111827" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="24" y="63" font-family="Inter,system-ui,sans-serif" font-size="15" font-weight="700" fill="#a78bfa">AskStudio Admin</text>
  <text x="180" y="62" font-family="Inter,system-ui,sans-serif" font-size="13" fill="rgba(255,255,255,0.5)">Dashboard</text>
  <text x="268" y="62" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="white">RPC Health</text>
  <rect x="263" y="78" width="78" height="2" rx="1" fill="#a78bfa"/>
  <text x="360" y="62" font-family="Inter,system-ui,sans-serif" font-size="13" fill="rgba(255,255,255,0.5)">Tokens</text>
  <text x="424" y="62" font-family="Inter,system-ui,sans-serif" font-size="13" fill="rgba(255,255,255,0.5)">Analytics</text>

  <!-- Page title -->
  <text x="24" y="122" font-family="Inter,system-ui,sans-serif" font-size="22" font-weight="700" fill="white">RPC Health Monitor</text>

  <!-- Endpoint 1 — healthy, active -->
  <rect x="24" y="142" width="780" height="88" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(34,197,94,0.2)" stroke-width="1"/>
  <rect x="24" y="142" width="4" height="88" rx="2" fill="#4ade80"/>
  <text x="46" y="170" font-family="monospace,monospace" font-size="14" fill="white">https://api.mainnet-beta.solana.com</text>
  <rect x="672" y="155" width="80" height="22" rx="11" fill="rgba(34,197,94,0.15)"/>
  <text x="712" y="170" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#4ade80" text-anchor="middle">● Online</text>
  <text x="46" y="192" font-family="Inter,system-ui,sans-serif" font-size="12" fill="rgba(255,255,255,0.4)">Last checked: 7:42:15 PM</text>
  <text x="46" y="212" font-family="Inter,system-ui,sans-serif" font-size="11" fill="rgba(255,255,255,0.25)">Primary · Round-robin active</text>
  <text x="762" y="192" font-family="Inter,system-ui,sans-serif" font-size="16" font-weight="600" fill="rgba(255,255,255,0.7)" text-anchor="end">87ms</text>

  <!-- Endpoint 2 — healthy -->
  <rect x="24" y="246" width="780" height="88" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(34,197,94,0.15)" stroke-width="1"/>
  <rect x="24" y="246" width="4" height="88" rx="2" fill="#4ade80"/>
  <text x="46" y="274" font-family="monospace,monospace" font-size="14" fill="white">https://rpc.ankr.com/solana</text>
  <rect x="672" y="259" width="80" height="22" rx="11" fill="rgba(34,197,94,0.15)"/>
  <text x="712" y="274" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#4ade80" text-anchor="middle">● Online</text>
  <text x="46" y="296" font-family="Inter,system-ui,sans-serif" font-size="12" fill="rgba(255,255,255,0.4)">Last checked: 7:42:15 PM</text>
  <text x="46" y="316" font-family="Inter,system-ui,sans-serif" font-size="11" fill="rgba(255,255,255,0.25)">Fallback endpoint</text>
  <text x="762" y="296" font-family="Inter,system-ui,sans-serif" font-size="16" font-weight="600" fill="rgba(255,255,255,0.7)" text-anchor="end">124ms</text>

  <!-- Endpoint 3 — unhealthy -->
  <rect x="24" y="350" width="780" height="88" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(239,68,68,0.2)" stroke-width="1"/>
  <rect x="24" y="350" width="4" height="88" rx="2" fill="#f87171"/>
  <text x="46" y="378" font-family="monospace,monospace" font-size="14" fill="rgba(255,255,255,0.5)">https://solana.public-rpc.com</text>
  <rect x="666" y="363" width="86" height="22" rx="11" fill="rgba(239,68,68,0.15)"/>
  <text x="709" y="378" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#f87171" text-anchor="middle">● Offline</text>
  <text x="46" y="400" font-family="Inter,system-ui,sans-serif" font-size="12" fill="rgba(255,255,255,0.4)">Last checked: 7:42:15 PM</text>
  <text x="46" y="420" font-family="Inter,system-ui,sans-serif" font-size="11" fill="rgba(255,255,255,0.25)">Backup endpoint · timeout after 5,000ms</text>
  <text x="762" y="400" font-family="Inter,system-ui,sans-serif" font-size="16" font-weight="600" fill="rgba(255,255,255,0.35)" text-anchor="end">Timeout</text>

  <!-- Info panel -->
  <rect x="24" y="458" width="780" height="100" rx="14" fill="rgba(147,51,234,0.06)" stroke="rgba(147,51,234,0.2)" stroke-width="1"/>
  <text x="44" y="484" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#c084fc">How failover works</text>
  <text x="44" y="506" font-family="Inter,system-ui,sans-serif" font-size="12" fill="rgba(255,255,255,0.5)">1. RpcManager pings all endpoints every 30 s with a 5 s timeout.</text>
  <text x="44" y="524" font-family="Inter,system-ui,sans-serif" font-size="12" fill="rgba(255,255,255,0.5)">2. Active endpoint rotates round-robin among healthy endpoints.</text>
  <text x="44" y="542" font-family="Inter,system-ui,sans-serif" font-size="12" fill="rgba(255,255,255,0.5)">3. A pinned endpoint (set via /api/rpc) bypasses rotation until unpinned.</text>

  <!-- Pin endpoint tile (right column) -->
  <rect x="828" y="142" width="428" height="170" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="848" y="170" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="white">Pin Endpoint</text>
  <text x="848" y="192" font-family="Inter,system-ui,sans-serif" font-size="11" fill="rgba(255,255,255,0.4)">Force all connections to a single endpoint.</text>
  <!-- simulated input -->
  <rect x="848" y="202" width="390" height="36" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="860" y="225" font-family="monospace,monospace" font-size="11" fill="rgba(255,255,255,0.3)">https://api.mainnet-beta.solana.com</text>
  <rect x="848" y="250" width="186" height="36" rx="8" fill="rgba(147,51,234,0.15)" stroke="rgba(147,51,234,0.3)" stroke-width="1"/>
  <text x="941" y="273" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="600" fill="#c084fc" text-anchor="middle">Pin Endpoint</text>
  <rect x="1046" y="250" width="192" height="36" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="1142" y="273" font-family="Inter,system-ui,sans-serif" font-size="12" fill="rgba(255,255,255,0.5)" text-anchor="middle">Clear Pin</text>
  <text x="848" y="310" font-family="Inter,system-ui,sans-serif" font-size="11" fill="rgba(255,255,255,0.25)">POST /admin/api/rpc  { endpoint: "…", pin: true }</text>

  <!-- Latency chart placeholder -->
  <rect x="828" y="330" width="428" height="228" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="848" y="358" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="white">Latency (last 10 checks)</text>
  <!-- Simple bar chart bars -->
  <rect x="848" y="520" width="26" height="40" rx="3" fill="rgba(147,51,234,0.6)"/>
  <rect x="886" y="505" width="26" height="55" rx="3" fill="rgba(147,51,234,0.6)"/>
  <rect x="924" y="510" width="26" height="50" rx="3" fill="rgba(147,51,234,0.6)"/>
  <rect x="962" y="498" width="26" height="62" rx="3" fill="rgba(147,51,234,0.6)"/>
  <rect x="1000" y="515" width="26" height="45" rx="3" fill="rgba(147,51,234,0.6)"/>
  <rect x="1038" y="508" width="26" height="52" rx="3" fill="rgba(147,51,234,0.6)"/>
  <rect x="1076" y="495" width="26" height="65" rx="3" fill="rgba(147,51,234,0.6)"/>
  <rect x="1114" y="505" width="26" height="55" rx="3" fill="rgba(147,51,234,0.6)"/>
  <rect x="1152" y="502" width="26" height="58" rx="3" fill="rgba(147,51,234,0.6)"/>
  <rect x="1190" y="500" width="26" height="60" rx="3" fill="rgba(147,51,234,0.8)"/>
  <line x1="848" y1="562" x2="1234" y2="562" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="848" y="540" font-family="Inter,system-ui,sans-serif" font-size="9" fill="rgba(255,255,255,0.3)">87ms</text>
  <text x="1190" y="540" font-family="Inter,system-ui,sans-serif" font-size="9" fill="rgba(255,255,255,0.3)">87ms</text>

  <!-- Browser chrome -->
  <rect x="0" y="0" width="1280" height="30" fill="rgba(0,0,0,0.6)"/>
  <circle cx="18" cy="15" r="6" fill="#ff5f57"/>
  <circle cx="38" cy="15" r="6" fill="#febc2e"/>
  <circle cx="58" cy="15" r="6" fill="#28c840"/>
  <rect x="200" y="7" width="880" height="16" rx="8" fill="rgba(255,255,255,0.08)"/>
  <text x="640" y="19" font-family="Inter,system-ui,sans-serif" font-size="11" fill="rgba(255,255,255,0.4)" text-anchor="middle">localhost:3001/admin/rpc</text>
</svg>
