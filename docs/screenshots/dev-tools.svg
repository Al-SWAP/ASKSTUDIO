  <text x="274" y="194" font-family="Inter,system-ui,sans-serif" font-size="12" fill="rgba(255,255,255,0.45)">Live endpoint management</text>
  <text x="274" y="212" font-family="Inter,system-ui,sans-serif" font-size="11" fill="rgba(255,255,255,0.25)">Check health · switch primary</text>
  <text x="274" y="236" font-family="Inter,system-ui,sans-serif" font-size="11" fill="rgba(52,211,153,0.6)">→ /dev/rpc</text>

