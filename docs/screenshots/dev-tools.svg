  <rect x="0" y="158" width="220" height="36" fill="transparent"/>
  <text x="20" y="181" font-family="Inter,system-ui,sans-serif" font-size="13" fill="rgba(255,255,255,0.55)">🔌  RPC Switcher</text>

  <rect x="0" y="194" width="220" height="36" fill="transparent"/>
  <text x="20" y="217" font-family="Inter,system-ui,sans-serif" font-size="13" fill="rgba(255,255,255,0.55)">🔍  Route Debugger</text>

  <rect x="0" y="230" width="220" height="36" fill="transparent"/>
  <text x="20" y="253" font-family="Inter,system-ui,sans-serif" font-size="13" fill="rgba(255,255,255,0.55)">🔨  TX Builder</text>

  <rect x="0" y="266" width="220" height="36" fill="transparent"/>
  <text x="20" y="289" font-family="Inter,system-ui,sans-serif" font-size="13" fill="rgba(255,255,255,0.55)">🎮  Swap Simulator</text>

