  <text x="276" y="422" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#34d399">Quick API reference</text>
  <text x="276" y="446" font-family="Inter,system-ui,sans-serif" font-size="12" fill="rgba(255,255,255,0.45)">
    GET /dev/api/quote?inputMint=…&amp;outputMint=…&amp;amount=…&amp;slippageBps=50   ·   GET /dev/api/tokens   ·   GET /dev/api/rpc
  </text>

  <!-- Terminal window -->
  <rect x="256" y="484" width="1000" height="270" rx="14" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Terminal title bar -->
  <rect x="256" y="484" width="1000" height="34" rx="14" fill="rgba(255,255,255,0.04)"/>
  <rect x="256" y="498" width="1000" height="20" fill="rgba(255,255,255,0.04)"/>
  <circle cx="276" cy="501" r="5" fill="#ff5f57"/>
  <circle cx="294" cy="501" r="5" fill="#febc2e"/>
  <circle cx="312" cy="501" r="5" fill="#28c840"/>
  <text x="620" y="505" font-family="Inter,system-ui,sans-serif" font-size="11" fill="rgba(255,255,255,0.35)" text-anchor="middle">AskStudio Dev — Terminal</text>
  <!-- Terminal content -->
  <text x="276" y="536" font-family="monospace,monospace" font-size="12" fill="#34d399">$ curl "localhost:3002/dev/api/quote?inputMint=So111…&amp;outputMint=EPjF…&amp;amount=1500000000"</text>
  <text x="276" y="558" font-family="monospace,monospace" font-size="11" fill="rgba(255,255,255,0.5)">{</text>
  <text x="276" y="574" font-family="monospace,monospace" font-size="11" fill="rgba(255,255,255,0.5)">  "inputMint": "So11111111111111111111111111111111111111112",</text>
  <text x="276" y="590" font-family="monospace,monospace" font-size="11" fill="rgba(255,255,255,0.5)">  "outputMint": "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v",</text>
  <text x="276" y="606" font-family="monospace,monospace" font-size="11" fill="rgba(255,255,255,0.5)">  "inAmount": "1500000000",  "outAmount": "183241200",</text>
  <text x="276" y="622" font-family="monospace,monospace" font-size="11" fill="#4ade80">  "priceImpactPct": "0.031",  "routePlan": [ … 2 hops … ],</text>
  <text x="276" y="638" font-family="monospace,monospace" font-size="11" fill="#4ade80">  "score": 0.892,  "latencyMs": 142</text>
  <text x="276" y="654" font-family="monospace,monospace" font-size="11" fill="rgba(255,255,255,0.5)">}</text>
  <text x="276" y="676" font-family="monospace,monospace" font-size="12" fill="#34d399">$ <tspan fill="rgba(52,211,153,0.5)">█</tspan></text>
