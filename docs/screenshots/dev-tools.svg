  <!-- Grid of tool cards -->
  <!-- Row 1 -->
  <!-- RPC Switcher -->
  <rect x="256" y="136" width="244" height="112" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(52,211,153,0.15)" stroke-width="1"/>
