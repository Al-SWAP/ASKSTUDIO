  <text x="534" y="194" font-family="Inter,system-ui,sans-serif" font-size="12" fill="rgba(255,255,255,0.45)">Inspect raw Jupiter routes</text>
  <text x="534" y="212" font-family="Inter,system-ui,sans-serif" font-size="11" fill="rgba(255,255,255,0.25)">Live quote · route scoring</text>
  <text x="534" y="236" font-family="Inter,system-ui,sans-serif" font-size="11" fill="rgba(52,211,153,0.6)">→ /dev/routes</text>

