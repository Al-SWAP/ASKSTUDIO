  <!-- Swap Simulator -->
  <rect x="256" y="264" width="244" height="112" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(52,211,153,0.15)" stroke-width="1"/>
  <rect x="256" y="264" width="244" height="4" rx="2" fill="rgba(52,211,153,0.5)"/>
  <text x="274" y="300" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="#34d399">Swap Simulator</text>
  <text x="274" y="322" font-family="Inter,system-ui,sans-serif" font-size="12" fill="rgba(255,255,255,0.45)">Simulate without signing</text>
  <text x="274" y="340" font-family="Inter,system-ui,sans-serif" font-size="11" fill="rgba(255,255,255,0.25)">Test flows · dry-run swap</text>
  <text x="274" y="364" font-family="Inter,system-ui,sans-serif" font-size="11" fill="rgba(52,211,153,0.6)">→ /dev/simulator</text>

  <!-- Token Inspector -->
  <rect x="516" y="264" width="244" height="112" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(52,211,153,0.15)" stroke-width="1"/>
  <rect x="516" y="264" width="244" height="4" rx="2" fill="rgba(52,211,153,0.5)"/>
  <text x="534" y="300" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="#34d399">Token Inspector</text>
