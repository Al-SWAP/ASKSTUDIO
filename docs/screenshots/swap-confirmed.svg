<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#0d0d18"/>
    </linearGradient>
    <radialGradient id="purpleGlow" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(120,40,200,0.12)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="swapBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="cardGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="rgba(139,92,246,0.4)"/>
    </filter>
  </defs>

  <rect width="1280" height="800" fill="url(#bg)"/>
  <rect width="1280" height="800" fill="url(#purpleGlow)" opacity="0.7"/>

  <!-- Title -->
  <text x="640" y="68" font-family="Inter,system-ui,sans-serif" font-size="38" font-weight="800"
        fill="url(#titleGradient)" text-anchor="middle">AskStudio</text>
  <text x="640" y="92" font-family="Inter,system-ui,sans-serif" font-size="13"
        fill="rgba(255,255,255,0.5)" text-anchor="middle">AI-powered DEX aggregator · Jupiter + Raydium + Orca</text>

  <!-- Swap Card -->
  <rect x="390" y="108" width="500" height="580" rx="20"
        fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"
        filter="url(#cardGlow)"/>

  <!-- Card header -->
  <text x="416" y="148" font-family="Inter,system-ui,sans-serif" font-size="16" font-weight="700" fill="white">Swap</text>
  <!-- wallet connected -->
  <rect x="742" y="130" width="128" height="32" rx="10" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <circle cx="762" cy="146" r="7" fill="#9333ea"/>
  <text x="774" y="151" font-family="Inter,system-ui,sans-serif" font-size="11" fill="rgba(255,255,255,0.9)">7xKp…4mRt</text>

  <!-- YOU PAY -->
  <rect x="410" y="166" width="460" height="80" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="430" y="185" font-family="Inter,system-ui,sans-serif" font-size="10" fill="rgba(255,255,255,0.4)" letter-spacing="1.5">YOU PAY</text>
  <rect x="430" y="194" width="80" height="30" rx="10" fill="rgba(255,255,255,0.1)"/>
  <circle cx="447" cy="209" r="9" fill="#9945FF"/>
  <text x="447" y="214" font-family="Inter,system-ui,sans-serif" font-size="8" font-weight="700" fill="white" text-anchor="middle">◎</text>
  <text x="461" y="213" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="white">SOL</text>
  <text x="499" y="213" font-family="Inter,system-ui,sans-serif" font-size="9" fill="rgba(255,255,255,0.4)">▾</text>
  <text x="834" y="220" font-family="Inter,system-ui,sans-serif" font-size="26" font-weight="700" fill="white" text-anchor="end">1.50</text>
  <text x="834" y="238" font-family="Inter,system-ui,sans-serif" font-size="10" fill="rgba(255,255,255,0.3)" text-anchor="end">Solana</text>

  <!-- Swap arrow -->
  <circle cx="640" cy="263" r="16" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="640" y="268" font-family="Inter,system-ui,sans-serif" font-size="13" fill="rgba(255,255,255,0.6)" text-anchor="middle">⇅</text>

  <!-- YOU RECEIVE -->
  <rect x="410" y="288" width="460" height="80" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="430" y="307" font-family="Inter,system-ui,sans-serif" font-size="10" fill="rgba(255,255,255,0.4)" letter-spacing="1.5">YOU RECEIVE</text>
  <rect x="430" y="316" width="84" height="30" rx="10" fill="rgba(255,255,255,0.1)"/>
  <circle cx="447" cy="331" r="9" fill="#2775CA"/>
  <text x="447" y="336" font-family="Inter,system-ui,sans-serif" font-size="7" font-weight="700" fill="white" text-anchor="middle">$</text>
  <text x="461" y="335" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="white">USDC</text>
  <text x="507" y="335" font-family="Inter,system-ui,sans-serif" font-size="9" fill="rgba(255,255,255,0.4)">▾</text>
  <text x="834" y="342" font-family="Inter,system-ui,sans-serif" font-size="26" font-weight="700" fill="white" text-anchor="end">183.241200</text>
  <text x="834" y="360" font-family="Inter,system-ui,sans-serif" font-size="10" fill="rgba(255,255,255,0.3)" text-anchor="end">USD Coin</text>

  <!-- Slippage -->
  <text x="430" y="398" font-family="Inter,system-ui,sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">Slippage:</text>
  <rect x="490" y="384" width="46" height="20" rx="6" fill="rgba(255,255,255,0.08)"/>
  <text x="513" y="398" font-family="Inter,system-ui,sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" text-anchor="middle">0.10%</text>
  <rect x="542" y="384" width="46" height="20" rx="6" fill="#7c3aed"/>
  <text x="565" y="398" font-family="Inter,system-ui,sans-serif" font-size="10" fill="white" text-anchor="middle">0.50%</text>
  <rect x="594" y="384" width="46" height="20" rx="6" fill="rgba(255,255,255,0.08)"/>
  <text x="617" y="398" font-family="Inter,system-ui,sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" text-anchor="middle">1.00%</text>
  <rect x="646" y="384" width="52" height="20" rx="6" fill="rgba(255,255,255,0.08)"/>
  <text x="672" y="398" font-family="Inter,system-ui,sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" text-anchor="middle">Custom</text>

  <!-- Route Info -->
  <rect x="410" y="414" width="460" height="64" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="430" y="434" font-family="Inter,system-ui,sans-serif" font-size="12" fill="rgba(255,255,255,0.7)">Best Route</text>
  <text x="830" y="434" font-family="Inter,system-ui,sans-serif" font-size="10" fill="rgba(255,255,255,0.4)" text-anchor="end">142ms</text>
  <rect x="430" y="443" width="46" height="18" rx="4" fill="rgba(147,51,234,0.2)" stroke="rgba(147,51,234,0.4)" stroke-width="1"/>
  <text x="453" y="455" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#c084fc" text-anchor="middle">SOL</text>
  <text x="489" y="454" font-family="Inter,system-ui,sans-serif" font-size="12" fill="rgba(255,255,255,0.3)">→</text>
  <rect x="498" y="443" width="64" height="18" rx="4" fill="rgba(147,51,234,0.2)" stroke="rgba(147,51,234,0.4)" stroke-width="1"/>
  <text x="530" y="455" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#c084fc" text-anchor="middle">mSOL</text>
  <text x="575" y="454" font-family="Inter,system-ui,sans-serif" font-size="12" fill="rgba(255,255,255,0.3)">→</text>
  <rect x="584" y="443" width="52" height="18" rx="4" fill="rgba(147,51,234,0.2)" stroke="rgba(147,51,234,0.4)" stroke-width="1"/>
  <text x="610" y="455" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#c084fc" text-anchor="middle">USDC</text>
  <text x="650" y="456" font-family="Inter,system-ui,sans-serif" font-size="10" fill="rgba(255,255,255,0.3)">Impact: 0.031%</text>

  <!-- Swap button -->
  <rect x="410" y="494" width="460" height="48" rx="14" fill="url(#swapBtn)"/>
  <filter id="btnGlow"><feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="rgba(139,92,246,0.5)"/></filter>
  <rect x="410" y="494" width="460" height="48" rx="14" fill="url(#swapBtn)" filter="url(#btnGlow)"/>
  <text x="640" y="524" font-family="Inter,system-ui,sans-serif" font-size="15" font-weight="700" fill="white" text-anchor="middle">Swap</text>

  <!-- ✓ Confirmed TX banner -->
  <rect x="410" y="554" width="460" height="64" rx="12"
        fill="rgba(34,197,94,0.08)" stroke="rgba(34,197,94,0.25)" stroke-width="1"/>
  <text x="430" y="576" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#4ade80">✓ Swap confirmed!</text>
  <text x="430" y="596" font-family="Inter,system-ui,sans-serif" font-size="10" fill="rgba(74,222,128,0.6)" text-decoration="underline">
    4tGxRm…Kp9sLq2mWf1ZaDnV3bBh — view on Solscan ↗
  </text>

  <!-- Footer -->
  <text x="640" y="720" font-family="Inter,system-ui,sans-serif" font-size="11"
        fill="rgba(255,255,255,0.25)" text-anchor="middle">
    Powered by Jupiter API · Real on-chain swaps · No custody
  </text>

  <!-- Browser chrome -->
  <rect x="0" y="0" width="1280" height="30" fill="rgba(0,0,0,0.5)"/>
  <circle cx="18" cy="15" r="6" fill="#ff5f57"/>
  <circle cx="38" cy="15" r="6" fill="#febc2e"/>
  <circle cx="58" cy="15" r="6" fill="#28c840"/>
  <rect x="200" y="7" width="880" height="16" rx="8" fill="rgba(255,255,255,0.08)"/>
  <text x="640" y="19" font-family="Inter,system-ui,sans-serif" font-size="11"
        fill="rgba(255,255,255,0.4)" text-anchor="middle">localhost:3000</text>
</svg>
