<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#0d0d18"/>
    </linearGradient>
    <radialGradient id="purpleGlow" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(120,40,200,0.12)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="cardGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="rgba(139,92,246,0.3)"/>
    </filter>
  </defs>

  <!-- Background (dimmed — modal open) -->
  <rect width="1280" height="800" fill="url(#bg)"/>
  <rect width="1280" height="800" fill="url(#purpleGlow)" opacity="0.6"/>
  <!-- backdrop blur overlay -->
  <rect width="1280" height="800" fill="rgba(0,0,0,0.7)"/>

  <!-- Token Selector Modal -->
  <rect x="390" y="100" width="500" height="600" rx="20"
        fill="rgba(15,12,28,0.98)" stroke="rgba(255,255,255,0.12)" stroke-width="1"
        filter="url(#cardGlow)"/>

  <!-- Modal header -->
  <text x="416" y="140" font-family="Inter,system-ui,sans-serif" font-size="16" font-weight="600"
        fill="white">Select Token</text>
  <!-- Close button -->
  <rect x="855" y="118" width="30" height="30" rx="8" fill="rgba(255,255,255,0.07)"/>
  <text x="870" y="138" font-family="Inter,system-ui,sans-serif" font-size="16"
        fill="rgba(255,255,255,0.5)" text-anchor="middle">✕</text>
  <!-- Divider -->
  <line x1="390" y1="157" x2="890" y2="157" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Search input -->
  <rect x="410" y="168" width="460" height="44" rx="12" fill="rgba(255,255,255,0.1)" stroke="rgba(139,92,246,0.5)" stroke-width="1"/>
  <text x="435" y="195" font-family="Inter,system-ui,sans-serif" font-size="13"
        fill="rgba(255,255,255,0.3)">🔍  Search by name, symbol, or address...</text>

  <!-- Token list items -->
  <!-- SOL -->
  <rect x="390" y="228" width="500" height="54" rx="0" fill="transparent"/>
  <rect x="390" y="228" width="500" height="54" rx="0" fill="rgba(255,255,255,0.05)" opacity="0"/>
  <g>
    <circle cx="420" cy="255" r="18" fill="#9945FF"/>
    <text x="420" y="260" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="700" fill="white" text-anchor="middle">◎</text>
    <text x="448" y="251" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="white">SOL</text>
    <text x="448" y="268" font-family="Inter,system-ui,sans-serif" font-size="11" fill="rgba(255,255,255,0.4)">Solana</text>
    <rect x="820" y="244" width="34" height="16" rx="3" fill="rgba(255,255,255,0.08)"/>
    <text x="837" y="256" font-family="Inter,system-ui,sans-serif" font-size="9" fill="rgba(255,255,255,0.4)" text-anchor="middle">JUP</text>
  </g>
  <line x1="410" y1="282" x2="870" y2="282" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <!-- USDC -->
  <rect x="390" y="282" width="500" height="54" rx="0" fill="rgba(255,255,255,0.07)"/>
  <circle cx="420" cy="309" r="18" fill="#2775CA"/>
  <text x="420" y="314" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="700" fill="white" text-anchor="middle">$</text>
  <text x="448" y="305" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="#c084fc">USDC</text>
