  <line x1="410" y1="498" x2="870" y2="498" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <!-- JTO -->
  <rect x="390" y="498" width="500" height="54" fill="transparent"/>
  <circle cx="420" cy="525" r="18" fill="rgba(147,51,234,0.6)"/>
  <text x="420" y="530" font-family="Inter,system-ui,sans-serif" font-size="9" font-weight="700" fill="white" text-anchor="middle">JTO</text>
  <text x="448" y="521" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="white">JTO</text>
  <text x="448" y="538" font-family="Inter,system-ui,sans-serif" font-size="11" fill="rgba(255,255,255,0.4)">Jito</text>
  <rect x="820" y="514" width="34" height="16" rx="3" fill="rgba(255,255,255,0.08)"/>
  <text x="837" y="526" font-family="Inter,system-ui,sans-serif" font-size="9" fill="rgba(255,255,255,0.4)" text-anchor="middle">JUP</text>
  <line x1="410" y1="552" x2="870" y2="552" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <!-- WIF -->
  <rect x="390" y="552" width="500" height="54" fill="transparent"/>
  <circle cx="420" cy="579" r="18" fill="#F97316"/>
  <text x="420" y="584" font-family="Inter,system-ui,sans-serif" font-size="9" font-weight="700" fill="white" text-anchor="middle">WIF</text>
  <text x="448" y="575" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="white">WIF</text>
  <text x="448" y="592" font-family="Inter,system-ui,sans-serif" font-size="11" fill="rgba(255,255,255,0.4)">dogwifhat</text>
  <rect x="820" y="568" width="34" height="16" rx="3" fill="rgba(255,255,255,0.08)"/>
  <text x="837" y="580" font-family="Inter,system-ui,sans-serif" font-size="9" fill="rgba(255,255,255,0.4)" text-anchor="middle">JUP</text>

  <!-- Footer divider -->
  <line x1="390" y1="646" x2="890" y2="646" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="640" y="666" font-family="Inter,system-ui,sans-serif" font-size="11"
        fill="rgba(255,255,255,0.3)" text-anchor="middle">
    1,250 tokens from Jupiter · Raydium · Orca
  </text>

  <!-- Browser chrome -->
  <rect x="0" y="0" width="1280" height="30" fill="rgba(0,0,0,0.6)"/>
  <circle cx="18" cy="15" r="6" fill="#ff5f57"/>
  <circle cx="38" cy="15" r="6" fill="#febc2e"/>
  <circle cx="58" cy="15" r="6" fill="#28c840"/>
  <rect x="200" y="7" width="880" height="16" rx="8" fill="rgba(255,255,255,0.08)"/>
  <text x="640" y="19" font-family="Inter,system-ui,sans-serif" font-size="11"
        fill="rgba(255,255,255,0.4)" text-anchor="middle">localhost:3000</text>
</svg>
