  <text x="420" y="476" font-family="Inter,system-ui,sans-serif" font-size="9" font-weight="700" fill="white" text-anchor="middle">ORCA</text>
  <text x="448" y="467" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="white">ORCA</text>
  <text x="448" y="484" font-family="Inter,system-ui,sans-serif" font-size="11" fill="rgba(255,255,255,0.4)">Orca</text>
  <rect x="806" y="460" width="34" height="16" rx="3" fill="rgba(255,255,255,0.08)"/>
  <text x="823" y="472" font-family="Inter,system-ui,sans-serif" font-size="9" fill="rgba(255,255,255,0.4)" text-anchor="middle">JUP</text>
  <rect x="844" y="460" width="40" height="16" rx="3" fill="rgba(255,255,255,0.08)"/>
