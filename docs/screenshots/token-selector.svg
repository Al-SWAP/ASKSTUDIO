  <text x="823" y="418" font-family="Inter,system-ui,sans-serif" font-size="9" fill="rgba(255,255,255,0.4)" text-anchor="middle">JUP</text>
  <rect x="844" y="406" width="34" height="16" rx="3" fill="rgba(255,255,255,0.08)"/>
  <text x="861" y="418" font-family="Inter,system-ui,sans-serif" font-size="9" fill="rgba(255,255,255,0.4)" text-anchor="middle">RAY</text>
