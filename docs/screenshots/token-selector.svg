  <text x="823" y="310" font-family="Inter,system-ui,sans-serif" font-size="9" fill="rgba(255,255,255,0.4)" text-anchor="middle">JUP</text>
  <rect x="844" y="298" width="34" height="16" rx="3" fill="rgba(255,255,255,0.08)"/>
  <text x="861" y="310" font-family="Inter,system-ui,sans-serif" font-size="9" fill="rgba(255,255,255,0.4)" text-anchor="middle">RAY</text>
  <line x1="410" y1="336" x2="870" y2="336" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

