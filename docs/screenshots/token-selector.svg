  <rect x="390" y="336" width="500" height="54" fill="transparent"/>
  <circle cx="420" cy="363" r="18" fill="#26A17B"/>
  <text x="420" y="368" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="700" fill="white" text-anchor="middle">₮</text>
  <text x="448" y="359" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="white">USDT</text>
