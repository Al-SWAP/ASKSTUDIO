  <text x="837" y="364" font-family="Inter,system-ui,sans-serif" font-size="9" fill="rgba(255,255,255,0.4)" text-anchor="middle">JUP</text>
  <line x1="410" y1="390" x2="870" y2="390" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <!-- RAY -->
  <rect x="390" y="390" width="500" height="54" fill="transparent"/>
  <circle cx="420" cy="417" r="18" fill="#4C9BE8"/>
  <text x="420" y="422" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="700" fill="white" text-anchor="middle">R</text>
  <text x="448" y="413" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="white">RAY</text>
  <text x="448" y="430" font-family="Inter,system-ui,sans-serif" font-size="11" fill="rgba(255,255,255,0.4)">Raydium</text>
