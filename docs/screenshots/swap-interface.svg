<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#0d0d18"/>
    </linearGradient>
    <radialGradient id="purpleGlow" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(120,40,200,0.15)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="80%" cy="20%" r="40%">
      <stop offset="0%" stop-color="rgba(40,100,255,0.1)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="swapBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="cardGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="rgba(139,92,246,0.4)"/>
    </filter>
    <clipPath id="cardClip">
      <rect x="390" y="120" width="500" height="560" rx="20"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1280" height="800" fill="url(#bg)"/>
  <rect width="1280" height="800" fill="url(#purpleGlow)" opacity="0.8"/>
  <rect width="1280" height="800" fill="url(#blueGlow)" opacity="0.8"/>

  <!-- Neon glow effect behind card -->
  <rect x="390" y="120" width="500" height="560" rx="20" fill="rgba(139,92,246,0.05)"
        filter="url(#cardGlow)"/>

  <!-- Page title -->
  <text x="640" y="85" font-family="Inter,system-ui,sans-serif" font-size="42" font-weight="800"
        fill="url(#titleGradient)" text-anchor="middle">AskStudio</text>
  <text x="640" y="112" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="400"
        fill="rgba(255,255,255,0.5)" text-anchor="middle">
    AI-powered DEX aggregator · Jupiter + Raydium + Orca
  </text>

  <!-- Swap Card (glass) -->
  <rect x="390" y="130" width="500" height="550" rx="20"
        fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Card header -->
  <text x="416" y="172" font-family="Inter,system-ui,sans-serif" font-size="16" font-weight="700"
        fill="white">Swap</text>

  <!-- Wallet button -->
  <rect x="750" y="152" width="120" height="34" rx="10" fill="rgba(255,255,255,0.1)"
        stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <circle cx="771" cy="169" r="7" fill="#9333ea"/>
  <text x="783" y="174" font-family="Inter,system-ui,sans-serif" font-size="12" fill="rgba(255,255,255,0.9)">
    7xKp…4mRt
  </text>

  <!-- YOU PAY section -->
  <rect x="410" y="192" width="460" height="88" rx="12"
        fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="430" y="212" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="600"
        fill="rgba(255,255,255,0.4)" letter-spacing="1.5">YOU PAY</text>
  <!-- SOL token button -->
  <rect x="430" y="222" width="80" height="32" rx="10" fill="rgba(255,255,255,0.1)"/>
  <circle cx="448" cy="238" r="9" fill="#9945FF"/>
  <text x="448" y="243" font-family="Inter,system-ui,sans-serif" font-size="8" font-weight="700"
        fill="white" text-anchor="middle">◎</text>
  <text x="462" y="242" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600"
        fill="white">SOL</text>
  <text x="503" y="242" font-family="Inter,system-ui,sans-serif" font-size="10" fill="rgba(255,255,255,0.4)">▾</text>
  <!-- Amount input -->
  <text x="836" y="248" font-family="Inter,system-ui,sans-serif" font-size="28" font-weight="700"
        fill="white" text-anchor="end">1.50</text>
  <text x="836" y="268" font-family="Inter,system-ui,sans-serif" font-size="11"
        fill="rgba(255,255,255,0.3)" text-anchor="end">Solana</text>

  <!-- Swap arrow button -->
  <circle cx="640" cy="296" r="18" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="640" y="301" font-family="Inter,system-ui,sans-serif" font-size="14" fill="rgba(255,255,255,0.6)"
        text-anchor="middle">⇅</text>

  <!-- YOU RECEIVE section -->
  <rect x="410" y="322" width="460" height="88" rx="12"
        fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="430" y="342" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="600"
        fill="rgba(255,255,255,0.4)" letter-spacing="1.5">YOU RECEIVE</text>
  <!-- USDC token button -->
  <rect x="430" y="352" width="84" height="32" rx="10" fill="rgba(255,255,255,0.1)"/>
  <circle cx="449" cy="368" r="9" fill="#2775CA"/>
  <text x="449" y="373" font-family="Inter,system-ui,sans-serif" font-size="7" font-weight="700"
        fill="white" text-anchor="middle">$</text>
  <text x="463" y="372" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600"
        fill="white">USDC</text>
  <text x="507" y="372" font-family="Inter,system-ui,sans-serif" font-size="10" fill="rgba(255,255,255,0.4)">▾</text>
  <!-- Estimated output -->
  <text x="836" y="378" font-family="Inter,system-ui,sans-serif" font-size="28" font-weight="700"
        fill="white" text-anchor="end">183.241200</text>
  <text x="836" y="398" font-family="Inter,system-ui,sans-serif" font-size="11"
        fill="rgba(255,255,255,0.3)" text-anchor="end">USD Coin</text>

  <!-- Slippage row -->
  <text x="430" y="435" font-family="Inter,system-ui,sans-serif" font-size="12" fill="rgba(255,255,255,0.5)">
    Slippage:
  </text>
  <rect x="490" y="421" width="48" height="22" rx="6" fill="rgba(255,255,255,0.1)"/>
  <text x="514" y="436" font-family="Inter,system-ui,sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="middle">0.10%</text>
  <rect x="544" y="421" width="48" height="22" rx="6" fill="#7c3aed"/>
  <text x="568" y="436" font-family="Inter,system-ui,sans-serif" font-size="11" fill="white" text-anchor="middle">0.50%</text>
  <rect x="598" y="421" width="48" height="22" rx="6" fill="rgba(255,255,255,0.1)"/>
  <text x="622" y="436" font-family="Inter,system-ui,sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="middle">1.00%</text>
  <rect x="652" y="421" width="54" height="22" rx="6" fill="rgba(255,255,255,0.1)"/>
  <text x="679" y="436" font-family="Inter,system-ui,sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="middle">Custom</text>

  <!-- Route Info box -->
  <rect x="410" y="454" width="460" height="72" rx="12"
        fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="430" y="474" font-family="Inter,system-ui,sans-serif" font-size="12" fill="rgba(255,255,255,0.7)">
    Best Route
  </text>
  <text x="836" y="474" font-family="Inter,system-ui,sans-serif" font-size="11" fill="rgba(255,255,255,0.4)" text-anchor="end">
    142ms
  </text>
  <!-- Route hops -->
  <rect x="430" y="482" width="46" height="20" rx="5" fill="rgba(147,51,234,0.2)" stroke="rgba(147,51,234,0.4)" stroke-width="1"/>
  <text x="453" y="496" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#c084fc" text-anchor="middle">SOL</text>
  <text x="490" y="495" font-family="Inter,system-ui,sans-serif" font-size="14" fill="rgba(255,255,255,0.3)">→</text>
  <rect x="500" y="482" width="68" height="20" rx="5" fill="rgba(147,51,234,0.2)" stroke="rgba(147,51,234,0.4)" stroke-width="1"/>
  <text x="534" y="496" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#c084fc" text-anchor="middle">mSOL</text>
  <text x="582" y="495" font-family="Inter,system-ui,sans-serif" font-size="14" fill="rgba(255,255,255,0.3)">→</text>
  <rect x="592" y="482" width="54" height="20" rx="5" fill="rgba(147,51,234,0.2)" stroke="rgba(147,51,234,0.4)" stroke-width="1"/>
  <text x="619" y="496" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#c084fc" text-anchor="middle">USDC</text>
  <text x="700" y="496" font-family="Inter,system-ui,sans-serif" font-size="10" fill="rgba(255,255,255,0.3)">
    Price impact: 0.031%
  </text>

  <!-- Swap Button -->
  <rect x="410" y="542" width="460" height="52" rx="14" fill="url(#swapBtn)"/>
  <filter id="btnGlow">
    <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="rgba(139,92,246,0.5)"/>
  </filter>
  <rect x="410" y="542" width="460" height="52" rx="14" fill="url(#swapBtn)" filter="url(#btnGlow)"/>
  <text x="640" y="574" font-family="Inter,system-ui,sans-serif" font-size="16" font-weight="700"
        fill="white" text-anchor="middle">Swap</text>

  <!-- Footer -->
  <text x="640" y="710" font-family="Inter,system-ui,sans-serif" font-size="12"
        fill="rgba(255,255,255,0.3)" text-anchor="middle">
    Powered by Jupiter API · Real on-chain swaps · No custody
  </text>

  <!-- Browser chrome hint -->
  <rect x="0" y="0" width="1280" height="30" fill="rgba(0,0,0,0.5)"/>
  <circle cx="18" cy="15" r="6" fill="#ff5f57"/>
  <circle cx="38" cy="15" r="6" fill="#febc2e"/>
  <circle cx="58" cy="15" r="6" fill="#28c840"/>
  <rect x="200" y="7" width="880" height="16" rx="8" fill="rgba(255,255,255,0.08)"/>
  <text x="640" y="19" font-family="Inter,system-ui,sans-serif" font-size="11"
        fill="rgba(255,255,255,0.4)" text-anchor="middle">localhost:3000</text>
</svg>
