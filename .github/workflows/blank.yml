name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-typecheck:
    name: Build & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check all apps and packages
        run: pnpm turbo run type-check --filter=!@askstudio/mobile --filter=!@askstudio/desktop

      - name: Build all apps and packages
        run: pnpm turbo run build --filter=!@askstudio/mobile --filter=!@askstudio/desktop
        env:
          NEXT_PUBLIC_SOLANA_RPC: ${{ vars.NEXT_PUBLIC_SOLANA_RPC || 'https://api.mainnet-beta.solana.com' }}
          NEXT_PUBLIC_SOLANA_RPC_FALLBACK: ${{ vars.NEXT_PUBLIC_SOLANA_RPC_FALLBACK || 'https://rpc.ankr.com/solana' }}
          NEXT_PUBLIC_SOLANA_RPC_BACKUP: ${{ vars.NEXT_PUBLIC_SOLANA_RPC_BACKUP || 'https://solana.public-rpc.com' }}
          NEXT_PUBLIC_JUPITER_API: ${{ vars.NEXT_PUBLIC_JUPITER_API || 'https://quote-api.jup.ag/v6' }}
          NEXT_PUBLIC_JUPITER_SWAP_API: ${{ vars.NEXT_PUBLIC_JUPITER_SWAP_API || 'https://quote-api.jup.ag/v6/swap' }}
          NEXT_PUBLIC_TOKEN_LIST: ${{ vars.NEXT_PUBLIC_TOKEN_LIST || 'https://token.jup.ag/all' }}
          NEXT_PUBLIC_RAYDIUM_API: ${{ vars.NEXT_PUBLIC_RAYDIUM_API || 'https://api.raydium.io/v2/sdk/liquidity/mainnet.json' }}
          NEXT_PUBLIC_ORCA_API: ${{ vars.NEXT_PUBLIC_ORCA_API || 'https://api.orca.so/allPools' }}
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ vars.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID || 'public_default_project_id' }}
          NEXT_PUBLIC_FEE_RESERVE: ${{ vars.NEXT_PUBLIC_FEE_RESERVE || '' }}
          NEXT_PUBLIC_DEFAULT_FEE_BPS: ${{ vars.NEXT_PUBLIC_DEFAULT_FEE_BPS || '20' }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint all apps
        run: pnpm turbo run lint --filter=!@askstudio/mobile --filter=!@askstudio/desktop
